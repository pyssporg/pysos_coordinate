[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pysos-simulate"
dynamic = ["version"]
description = "Set up and supervise a federation of independently launched simulation instances."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "pyssporg" }]
requires-python = ">=3.10"
keywords = ["federation", "simulation", "supervisor", "processes", "ports", "co-simulation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
# Core stays standard-library only. Federation participants bring their own
# engines; this package never imports one and never pulls a runtime dependency.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff"]

[project.scripts]
pysos-simulate = "pysos_simulate.cli:main"

[project.urls]
Homepage = "https://github.com/pyssporg/pysos_simulate"
Repository = "https://github.com/pyssporg/pysos_simulate"
Issues = "https://github.com/pyssporg/pysos_simulate/issues"

[tool.hatch.version]
path = "src/pysos_simulate/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pysos_simulate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
