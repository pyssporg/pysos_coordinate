name: wheels

on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      # v5.6.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install build frontend
        run: |
          python -m pip install --upgrade pip build

      - name: Build wheel and sdist
        run: python -m build --wheel --sdist

      - name: Smoke test the wheel
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet dist/*.whl
          /tmp/smoke/bin/python -c "import pysos_coordinate; print(pysos_coordinate.__version__)"
          /tmp/smoke/bin/pysos-coordinate --version

      - name: Check the version tag
        if: startsWith(github.ref, 'refs/tags/v')
        # The version is dynamic (hatchling reads src/pysos_coordinate/__init__.py),
        # so read it back from the installed wheel rather than pyproject.toml.
        run: |
          version="$(/tmp/smoke/bin/python -c "import pysos_coordinate; print(pysos_coordinate.__version__)")"
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${version}." >&2
            exit 1
          fi

      # v4.6.2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dist
          path: dist/

      - name: Guard against an empty distribution
        run: |
          shopt -s nullglob
          wheels=(dist/*.whl)
          sdists=(dist/*.tar.gz)
          if [ ${#wheels[@]} -eq 0 ] || [ ${#sdists[@]} -eq 0 ]; then
            echo "dist/ must contain at least one .whl and one .tar.gz; refusing to publish." >&2
            exit 1
          fi
          echo "dist/ has ${#wheels[@]} wheel(s) and ${#sdists[@]} sdist(s)."

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
